[project]
name = "torubarov"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "flask>=3.1.3",
    "huggingface-hub[cli]>=2.1.1",
    "llama-cpp-python",
    "mysql-connector>=2.2.9",
    "pillow>=12.3.0",
    "xxhash>=4.0.1",
]

[project.scripts]
torubarov = "torubarov:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
llama-cpp-python = { git = "https://github.com/JamePeng/llama-cpp-python.git" }
